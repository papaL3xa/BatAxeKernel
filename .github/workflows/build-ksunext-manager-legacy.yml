name: Build KernelSU Next Manager (legacy 32473 compatibility)

on:
  workflow_dispatch:
  push:
    branches:
      - manager-ksunext-legacy-32473
    paths:
      - ".github/workflows/build-ksunext-manager-legacy.yml"
      - ".github/scripts/patch-ksunext-legacy-manager.py"

permissions:
  contents: read

jobs:
  build-manager:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout BatAxeKernel workflow files
        uses: actions/checkout@v4
        with:
          ref: manager-ksunext-legacy-32473

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Fetch official KernelSU Next Manager v3.1.0
        run: |
          git clone --depth 1 --branch v3.1.0 \
            https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          git -C KernelSU-Next rev-parse HEAD

      - name: Apply legacy 4.14 compatibility patch
        run: |
          cp .github/scripts/patch-ksunext-legacy-manager.py KernelSU-Next/manager/
          cd KernelSU-Next/manager
          python3 patch-ksunext-legacy-manager.py
          grep -q 'legacy.first > 0' app/src/main/cpp/ksu.cc
          grep -q 'LSM\*' app/src/main/cpp/ksu.cc
          grep -q 'Legacy API' app/src/main/cpp/ksu.cc

      - name: Build Manager APK (debug-signed, no kernel build)
        working-directory: KernelSU-Next/manager
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload compatible Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Manager-v3.1.0-legacy-32473
          path: KernelSU-Next/manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
