name: Telegram Notification

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Kernel Version'
        required: true
        type: string
      llvm:
        description: 'Clang Version'
        required: true
        type: string
      ksun:
        description: 'KernelSU Status'
        required: true
        type: string
      release_url:
        description: 'Release URL'
        required: true
        type: string
      device_count:
        description: 'Number of Devices Built'
        required: true
        type: string
      build_status:
        description: 'Build Status'
        required: true
        type: string
        default: 'success'
  workflow_run:
    workflows: ["Build (Release-Post Github)"]
    types:
      - completed
    branches: [main, master]

jobs:
  send-success-notification:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: 📱 Send Success Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🎉 *Build Automation Completed!*
            
            ✅ *Workflow Status:* SUCCESS
            📝 *Workflow:* ${{ github.event.workflow_run.name }}
            🔄 *Run ID:* ${{ github.event.workflow_run.id }}
            ⏰ *Finished At:* ${{ github.event.workflow_run.updated_at }}
            
            📊 *Details:*
            📁 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }})
            📦 [View Releases](https://github.com/${{ github.repository }}/releases)
            
            💬 *Support:*
            👥 [Telegram Group](https://t.me/PapaL3xaKernel/2)
            
            🏷️ *Tags:* #CI #Success #Automation
          format: markdown
          disable_web_page_preview: true

  send-failure-notification:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: 📱 Send Failure Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ *Build Automation Failed!*
            
            🔥 *Workflow Status:* FAILED
            📝 *Workflow:* ${{ github.event.workflow_run.name }}
            🔄 *Run ID:* ${{ github.event.workflow_run.id }}
            ⏰ *Finished At:* ${{ github.event.workflow_run.updated_at }}
            
            🔍 *Troubleshooting:*
            📁 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }})
            📋 [Check Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }})
            
            💬 *Support:*
            👥 [Telegram Group](https://t.me/PapaL3xaKernel/2)
            
            🏷️ *Tags:* #CI #Failed #NeedAttention
          format: markdown
          disable_web_page_preview: true

  send-manual-notification:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: 📱 Send Manual Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID || github.event.inputs.telegram_chat_id }}
          token: ${{ secrets.TELEGRAM_TOKEN || github.event.inputs.telegram_token }}
          message: |
            🚀 *BatAxeKernel Build Notification*
            
            📊 *Build Information:*
            ⚙️ *Version:* ${{ github.event.inputs.version }}
            🔧 *Toolchain:* Clang ${{ github.event.inputs.llvm }}
            🛠️ *KernelSU:* ${{ github.event.inputs.ksun }}
            📱 *Devices Built:* ${{ github.event.inputs.device_count }}
            ✅ *Status:* ${{ github.event.inputs.build_status }}
            
            📥 *Download Links:*
            🔗 [GitHub Release](${{ github.event.inputs.release_url }})
            
            💬 *Support & Discussion:*
            👥 [Telegram Group](https://t.me/PapaL3xaKernel/2)
            
            ⚠️ *Notes:*
            • Make sure you're on compatible firmware
            • Backup before flashing
            • Report issues on GitHub
            
            🏷️ *Tags:* #BatAxeKernel #KernelSU #Notification
          format: markdown
          disable_web_page_preview: true