name: Telegram Notification

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Kernel Version'
        required: true
        type: string
      llvm:
        description: 'Clang Version'
        required: true
        type: string
      ksun:
        description: 'KernelSU Status'
        required: true
        type: string
      release_url:
        description: 'Release URL'
        required: true
        type: string
      device_count:
        description: 'Number of Devices Built'
        required: true
        type: string
      build_status:
        description: 'Build Status'
        required: true
        type: string
        default: 'success'

jobs:
  send-telegram-notification:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📱 Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID || github.event.inputs.telegram_chat_id }}
          token: ${{ secrets.TELEGRAM_TOKEN || github.event.inputs.telegram_token }}
          message: |
            🚀 *BatAxeKernel Build Completed Successfully!*
            
            📊 *Build Information:*
            ⚙️ *Version:* ${{ github.event.inputs.version }}
            🔧 *Toolchain:* Clang ${{ github.event.inputs.llvm }}
            🛠️ *KernelSU:* ${{ github.event.inputs.ksun }}
            📱 *Devices Built:* ${{ github.event.inputs.device_count }}
            ✅ *Status:* ✅ SUCCESS
            
            📥 *Download Links:*
            🔗 [GitHub Release](${{ github.event.inputs.release_url }})
            
            💬 *Support & Discussion:*
            👥 [Telegram Group](https://t.me/PapaL3xaKernel/2)
            
            ⚠️ *Notes:*
            • Make sure you're on compatible firmware
            • Backup before flashing
            • Report issues on GitHub
            
            🏷️ *Tags:* #BatAxeKernel #KernelSU #OneUI4
          format: markdown
          disable_web_page_preview: true

  send-telegram-notification-failure:
    if: failure()
    runs-on: ubuntu-latest
    
    steps:
      - name: 📱 Send Telegram Failure Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID || github.event.inputs.telegram_chat_id }}
          token: ${{ secrets.TELEGRAM_TOKEN || github.event.inputs.telegram_token }}
          message: |
            ❌ *BatAxeKernel Build Failed!*
            
            📊 *Build Information:*
            ⚙️ *Version:* ${{ github.event.inputs.version }}
            🔧 *Toolchain:* Clang ${{ github.event.inputs.llvm }}
            🛠️ *KernelSU:* ${{ github.event.inputs.ksun }}
            📱 *Devices Built:* ${{ github.event.inputs.device_count }}
            ❌ *Status:* ❌ FAILED
            
            🔍 *Troubleshooting:*
            • Check GitHub Actions logs
            • Verify build parameters
            • Review kernel configuration
            
            💬 *Support:*
            👥 [Telegram Group](https://t.me/PapaL3xaKernel/2)
            
            🏷️ *Tags:* #BatAxeKernel #BuildFailed
          format: markdown
          disable_web_page_preview: true