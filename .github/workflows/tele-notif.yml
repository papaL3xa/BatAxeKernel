name: Telegram Notification

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Kernel Version'
        required: true
        type: string
      llvm:
        description: 'Clang Version'
        required: true
        type: string
      ksun:
        description: 'KernelSU Status'
        required: true
        type: string
      release_url:
        description: 'Release URL'
        required: true
        type: string
      device_count:
        description: 'Number of Devices Built'
        required: true
        type: string
      build_status:
        description: 'Build Status'
        required: true
        type: string
        default: 'success'

jobs:
  send-manual-notification:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📱 Send Manual Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID || github.event.inputs.telegram_chat_id }}
          token: ${{ secrets.TELEGRAM_TOKEN || github.event.inputs.telegram_token }}
          message: |
            🚀 *BatAxeKernel Manual Notification*
            
            📊 *Build Information:*
            ⚙️ *Version:* ${{ github.event.inputs.version }}
            🔧 *Toolchain:* Clang ${{ github.event.inputs.llvm }}
            🛠️ *KernelSU:* ${{ github.event.inputs.ksun }}
            📱 *Devices Built:* ${{ github.event.inputs.device_count }}
            ✅ *Status:* ${{ github.event.inputs.build_status }}
            
            📥 *Download Links:*
            🔗 [GitHub Release](${{ github.event.inputs.release_url }})
            
            💬 *Support & Discussion:*
            👥 [Telegram Group](https://t.me/PapaL3xaKernel/2)
            
            🏷️ *Tags:* #BatAxeKernel #ManualNotification
          format: markdown
          disable_web_page_preview: true