name: N971N Binary2 Original rsuntk KernelSU + Managers

on:
  push:
    branches:
      - chatgpt/ksu-dual-32473
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Original rsuntk driver and matching managers
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout BatAxeKernel with original submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify original rsuntk submodule
        shell: bash
        run: |
          set -euo pipefail
          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
          test "$(git -C KernelSU rev-parse HEAD)" = "88e37d606fc12758421c3e36b0f61499610cfe8d"
          git -C KernelSU fetch --unshallow origin || true
          COUNT="$(git -C KernelSU rev-list --count HEAD)"
          KSU_VERSION_CODE="$((30000 + COUNT))"
          echo "RSNTK_COMMIT=$(git -C KernelSU rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KSU_COMMIT_COUNT=$COUNT" >> "$GITHUB_ENV"
          echo "KSU_VERSION_CODE=$KSU_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Original rsuntk KernelSU commit: $(git -C KernelSU rev-parse HEAD)"
          echo "Original driver version code: $KSU_VERSION_CODE"

      - name: Install kernel and Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gcc-aarch64-linux-gnu \
            git libssl-dev lz4 make python3 zip zlib1g-dev openjdk-21-jdk

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" "cmake;4.1.0"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Generate shared manager signing key and configure driver identity
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/ksu-manager.jks" \
            -storepass "BatAxe-KSU-Manager-2026" -keypass "BatAxe-KSU-Manager-2026" \
            -alias ksu-manager -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BatAxeKernel rsuntk KernelSU Manager"
          keytool -exportcert -keystore "$GITHUB_WORKSPACE/ksu-manager.jks" \
            -storepass "BatAxe-KSU-Manager-2026" -alias ksu-manager \
            -file "$GITHUB_WORKSPACE/ksu-manager-cert.der"
          CERT_SIZE="$(wc -c < "$GITHUB_WORKSPACE/ksu-manager-cert.der" | tr -d ' ')"
          CERT_HASH="$(sha256sum "$GITHUB_WORKSPACE/ksu-manager-cert.der" | awk '{print $1}')"
          {
            echo "KSU_EXPECTED_SIZE=$CERT_SIZE"
            echo "KSU_EXPECTED_HASH=$CERT_HASH"
            echo "KSU_MANAGER_PACKAGE=me.weishu.kernelsu"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/ksu-manager.jks"
            echo "KEYSTORE_PASSWORD=BatAxe-KSU-Manager-2026"
            echo "KEY_ALIAS=ksu-manager"
            echo "KEY_PASSWORD=BatAxe-KSU-Manager-2026"
          } >> "$GITHUB_ENV"
          echo "Manager certificate DER size: $CERT_SIZE"
          echo "Manager certificate SHA256: $CERT_HASH"

      - name: Configure only KernelSU build options
        shell: bash
        run: |
          set -euo pipefail
          cat > arch/arm64/configs/ksu.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_ALLOWLIST_WORKAROUND=y
          EOF
          grep -q '^CONFIG_KSU=y$' arch/arm64/configs/ksu.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' arch/arm64/configs/ksu.config
          echo "No driver source replacement or patching is performed."
          echo "drivers/kernelsu -> $(readlink drivers/kernelsu)"

      - name: Build N971N Binary 2 kernel package with original driver
        shell: bash
        env:
          BUILD_VERSION: N971N-U2-RSUNTK-ORIGINAL
        run: |
          set -euo pipefail
          bash build.sh -m d1xks -v "$BUILD_VERSION" -k y -l 13 -r y
          test -s out/.config
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          grep -q "KernelSU version: $KSU_VERSION_CODE" build.log
          test -d build/export
          test "$(find build/export -maxdepth 1 -type f -name '*.zip' | wc -l)" -ge 1
          cp out/.config build/export/kernel.config
          cp build.log build/export/kernel-build.log
          printf 'repo=https://github.com/rsuntk/KernelSU.git\ncommit=%s\nversion_code=%s\n' \
            "$RSNTK_COMMIT" "$KSU_VERSION_CODE" > build/export/rsuntk-source-info.txt

      - name: Build official rsuntk KernelSU Manager from matching source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C KernelSU rev-parse HEAD)" = "$RSNTK_COMMIT"
          cd KernelSU/manager
          ./gradlew --no-daemon clean assembleRelease
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p "$GITHUB_WORKSPACE/manager-export"
          cp "$APK" "$GITHUB_WORKSPACE/manager-export/KernelSU-rsuntk-matching.apk"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$GITHUB_WORKSPACE/manager-export/KernelSU-rsuntk-matching.apk" \
            | tee "$GITHUB_WORKSPACE/manager-export/KernelSU-manager-badging.txt"
          grep -q "versionCode='$KSU_VERSION_CODE'" "$GITHUB_WORKSPACE/manager-export/KernelSU-manager-badging.txt"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs \
            "$GITHUB_WORKSPACE/manager-export/KernelSU-rsuntk-matching.apk" \
            | tee "$GITHUB_WORKSPACE/manager-export/KernelSU-manager-signature.txt"
          grep -qi "$KSU_EXPECTED_HASH" "$GITHUB_WORKSPACE/manager-export/KernelSU-manager-signature.txt"

      - name: Build current KernelSU Next Manager with legacy-driver fallback
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch dev https://github.com/KernelSU-Next/KernelSU-Next.git "$GITHUB_WORKSPACE/KernelSU-Next"
          cd "$GITHUB_WORKSPACE/KernelSU-Next/manager"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle.kts")
          s = p.read_text()
          old = "return major * 30000 + commitCount"
          if old not in s:
              raise SystemExit("Unexpected KernelSU Next manager versionCode formula")
          s = s.replace(old, 'return System.getenv("KSU_VERSION_CODE")?.toInt() ?: (major * 30000 + commitCount)')
          p.write_text(s)
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          needle = 'namespace = "com.rifsxd.ksunext"'
          if needle not in s:
              raise SystemExit("Unexpected KernelSU Next manager namespace")
          s = s.replace(needle, needle + '\n\n    defaultConfig {\n        applicationId = "me.weishu.kernelsu"\n    }')
          p.write_text(s)
          PY
          ./gradlew --no-daemon clean assembleRelease
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p "$GITHUB_WORKSPACE/manager-export"
          cp "$APK" "$GITHUB_WORKSPACE/manager-export/KernelSU-Next-legacy-driver-compatible.apk"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging \
            "$GITHUB_WORKSPACE/manager-export/KernelSU-Next-legacy-driver-compatible.apk" \
            | tee "$GITHUB_WORKSPACE/manager-export/KernelSU-Next-manager-badging.txt"
          grep -q "versionCode='$KSU_VERSION_CODE'" "$GITHUB_WORKSPACE/manager-export/KernelSU-Next-manager-badging.txt"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs \
            "$GITHUB_WORKSPACE/manager-export/KernelSU-Next-legacy-driver-compatible.apk" \
            | tee "$GITHUB_WORKSPACE/manager-export/KernelSU-Next-manager-signature.txt"
          grep -qi "$KSU_EXPECTED_HASH" "$GITHUB_WORKSPACE/manager-export/KernelSU-Next-manager-signature.txt"

      - name: Collect and checksum all outputs
        shell: bash
        run: |
          set -euo pipefail
          cp manager-export/* build/export/
          (cd build/export && sha256sum *.zip *.apk > SHA256SUMS)
          echo "Final KernelSU driver version: $KSU_VERSION_CODE"
          echo "Original rsuntk commit: $RSNTK_COMMIT"
          ls -lh build/export

      - name: Upload kernel and both manager APKs
        uses: actions/upload-artifact@v4
        with:
          name: N971N-U2-RSUNTK-Original-Driver-and-Managers
          path: |
            build/export/*.zip
            build/export/*.apk
            build/export/*.txt
            build/export/kernel.config
            build/export/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
