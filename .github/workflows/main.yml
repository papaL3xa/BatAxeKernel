name: Build Kernel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Memungkinkan trigger manual
    inputs:
      model:
        description: 'Device Model'
        required: true
        default: 'd2s'
        type: choice
        options:
        - beyond0lte
        - beyond1lte
        - beyond2lte
        - beyondx
        - d1
        - d1xks
        - d2s
        - d2x
      llvm:
        description: 'Toolchain Version'
        required: true
        default: '21'
        type: string
      ksu:
        description: 'Include KernelSU'
        required: true
        default: 'y'
        type: choice
        options:
        - y
        - n

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          bc \
          curl \
          git \
          zip \
          unzip
        
    - name: Make build.sh executable
      run: chmod +x build.sh
      
    - name: Build Kernel
      env:
        RELEASE: y
      run: |
        ./build.sh \
          --model ${{ github.event.inputs.model || 'd2s' }} \
          --llvm ${{ github.event.inputs.llvm || '21' }} \
          --ksu ${{ github.event.inputs.ksu || 'y' }} \
          --ver "CI-${{ github.sha }}"
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ github.event.inputs.model || 'd2s' }}
        path: |
          build/export/*.zip
          build.log
        retention-days: 7
        
    - name: Get build info
      id: build_info
      run: |
        BUILD_FILE=$(ls build/export/*.zip 2>/dev/null | head -1)
        if [ -n "$BUILD_FILE" ]; then
          echo "build_file=$(basename $BUILD_FILE)" >> $GITHUB_OUTPUT
          echo "build_exists=true" >> $GITHUB_OUTPUT
        else
          echo "build_exists=false" >> $GITHUB_OUTPUT
        fi
        
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && needs.build.outputs.build_exists == 'true'
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: kernel-build-*
        path: artifacts
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.event.inputs.model || 'd2s' }}-${{ github.run_id }}
        release_name: "Kernel Build - ${{ github.event.inputs.model || 'd2s' }}"
        body: |
          Automated Kernel Build
          - Model: ${{ github.event.inputs.model || 'd2s' }}
          - Toolchain: ${{ github.event.inputs.llvm || '21' }}
          - KernelSU: ${{ github.event.inputs.ksu || 'y' }}
          - Commit: ${{ github.sha }}
          - Build Date: ${{ github.event.head_commit.timestamp }}
        files: |
          artifacts/**/*.zip
          artifacts/**/build.log
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}