name: Se7enKernel N971N KernelSU-Next 32473 + Matching Manager

on:
  push:
    branches:
      - se7en-kernel-n971n
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout boot-tested BatAxeKernel base
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout boot-tested KernelSU kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/rsuntk/KernelSU.git KernelSU
          git -C KernelSU checkout --detach 88e37d606fc12758421c3e36b0f61499610cfe8d
          KSU_KERNEL_SHA="$(git -C KernelSU rev-parse HEAD)"
          KSU_KERNEL_COUNT="$(git -C KernelSU rev-list --count HEAD)"
          KSU_KERNEL_VERSION="$((30000 + KSU_KERNEL_COUNT))"
          test "$KSU_KERNEL_SHA" = "88e37d606fc12758421c3e36b0f61499610cfe8d"
          echo "KernelSU kernel source: $KSU_KERNEL_SHA"
          echo "KernelSU reachable commit count: $KSU_KERNEL_COUNT"
          echo "Kernel driver version from source formula: $KSU_KERNEL_VERSION"
          if [ "$KSU_KERNEL_VERSION" != "32473" ]; then
            echo "::error::Pinned KernelSU source computes $KSU_KERNEL_VERSION, not expected 32473. Refusing to build."
            exit 1
          fi
          {
            echo "KSU_KERNEL_SHA=$KSU_KERNEL_SHA"
            echo "KSU_KERNEL_COUNT=$KSU_KERNEL_COUNT"
            echo "KSU_KERNEL_VERSION=$KSU_KERNEL_VERSION"
          } >> "$GITHUB_ENV"

      - name: Checkout official KernelSU-Next Manager source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          git -C KernelSU-Next checkout --detach 9b5e60912d536ed4c38988c9b3a3ac48f1138d67
          KSUN_MANAGER_SHA="$(git -C KernelSU-Next rev-parse HEAD)"
          KSUN_MANAGER_COUNT="$(git -C KernelSU-Next rev-list --count HEAD)"
          KSUN_MANAGER_VERSION_CODE="$((10000 + KSUN_MANAGER_COUNT + 200))"
          test "$KSUN_MANAGER_SHA" = "9b5e60912d536ed4c38988c9b3a3ac48f1138d67"
          echo "KernelSU-Next Manager source: $KSUN_MANAGER_SHA"
          echo "Manager commit count: $KSUN_MANAGER_COUNT"
          echo "Manager APK versionCode from official formula: $KSUN_MANAGER_VERSION_CODE"
          {
            echo "KSUN_MANAGER_SHA=$KSUN_MANAGER_SHA"
            echo "KSUN_MANAGER_COUNT=$KSUN_MANAGER_COUNT"
            echo "KSUN_MANAGER_VERSION_CODE=$KSUN_MANAGER_VERSION_CODE"
          } >> "$GITHUB_ENV"

      - name: Integrate the boot-tested KernelSU fork into the kernel source
        shell: bash
        run: |
          set -euo pipefail
          test -f KernelSU/kernel/Kbuild
          test -f KernelSU/kernel/Kconfig
          mkdir -p drivers
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kbuild
          grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          echo "Pinned rsuntk/KernelSU Kbuild, Kconfig and symlink integration verified."

      - name: Set timezone and install kernel build dependencies
        run: |
          sudo timedatectl set-timezone Asia/Jakarta
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential gcc-aarch64-linux-gnu clang lld llvm

      - name: Set Se7enKernel name and build N971N
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^    KERNEL_NAME=BatAxeKernel$/    KERNEL_NAME=Se7enKernel/' build.sh
          grep -q '^    KERNEL_NAME=Se7enKernel$' build.sh
          chmod +x build.sh
          # Keep the boot-tested N971N parameters and existing KSUN config.
          bash build.sh -m d1xks -v N971N-KSUN-32473 -k y -l 13 -r n
          test -d build/out/d1xks/zip
          test -s build/out/d1xks/zip/boot.img

      - name: Set up Java 21 and Android SDK for official KSUN Manager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK required by official KSUN Manager
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/android-cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/android-cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline-tools"
          mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709"

      - name: Build official Manager from the exact same KernelSU-Next commit
        shell: bash
        run: |
          set -euo pipefail
          MANAGER_DIR="$GITHUB_WORKSPACE/KernelSU-Next/manager"
          test -x "$MANAGER_DIR/gradlew"
          cd "$MANAGER_DIR"
          ./gradlew --no-daemon assembleDebug
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='$KSUN_MANAGER_VERSION_CODE'"
          mkdir -p "$GITHUB_WORKSPACE/build/export"
          cp "$APK" "$GITHUB_WORKSPACE/build/export/Se7enKernel-KernelSU-Next-Manager-v${KSUN_MANAGER_VERSION_CODE}-debug.apk"

      - name: Record exact source, config and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/export
          {
            echo "Kernel base commit: $(git rev-parse HEAD)"
            echo "KernelSU kernel source: https://github.com/rsuntk/KernelSU.git"
            echo "KernelSU kernel commit: $KSU_KERNEL_SHA"
            echo "KernelSU kernel commit count: $KSU_KERNEL_COUNT"
            echo "KernelSU driver version: $KSU_KERNEL_VERSION"
            echo "KernelSU-Next Manager source: https://github.com/KernelSU-Next/KernelSU-Next.git"
            echo "KernelSU-Next Manager commit: $KSUN_MANAGER_SHA"
            echo "Manager APK versionCode: $KSUN_MANAGER_VERSION_CODE"
            echo "Manager package: com.rifsxd.ksunext"
            echo "Kernel name: Se7enKernel"
            echo "Device: SM-N971N (d1xks)"
            echo "Kernel localversion:"
            grep '^CONFIG_LOCALVERSION=' out/.config || true
          } > build/export/build-info.txt
          (cd build/out/d1xks/zip && sha256sum * > "$GITHUB_WORKSPACE/build/export/kernel-SHA256SUMS")
          (cd build/export && sha256sum *.apk > manager-SHA256SUMS)
          cat build/export/build-info.txt
          cat build/export/kernel-SHA256SUMS
          cat build/export/manager-SHA256SUMS

      - name: Upload Se7enKernel and matching official KSUN Manager
        uses: actions/upload-artifact@v4
        with:
          name: Se7enKernel-N971N-KernelSU-Next-32473-${{ github.run_number }}
          path: |
            build/out/d1xks/zip/*
            build/export/*
          if-no-files-found: error
          retention-days: 30
