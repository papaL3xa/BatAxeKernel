name: Se7enKernel N971N KSUN + Matching Manager

on:
  push:
    branches:
      - se7en-kernel-n971n
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout boot-tested BatAxeKernel base
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Fetch latest KernelSU submodule from its remote default branch
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- KernelSU
          git submodule update --init --remote --depth=1 KernelSU
          test -f KernelSU/kernel/Makefile
          KSU_SHA="$(git -C KernelSU rev-parse HEAD)"
          KSU_REMOTE="$(git -C KernelSU remote get-url origin)"
          KSU_VERSION="$(grep -oE -- '-DKSU_VERSION=[0-9]+' KernelSU/kernel/Makefile | head -n 1 | cut -d= -f2)"
          test -n "$KSU_VERSION"
          {
            echo "KSU_SHA=$KSU_SHA"
            echo "KSU_REMOTE=$KSU_REMOTE"
            echo "KSU_VERSION=$KSU_VERSION"
          } >> "$GITHUB_ENV"
          echo "Latest remote KernelSU commit: $KSU_SHA"
          echo "Kernel driver version: $KSU_VERSION"
          echo "Remote: $KSU_REMOTE"

      - name: Set timezone and install kernel build dependencies
        run: |
          sudo timedatectl set-timezone Asia/Jakarta
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential gcc-aarch64-linux-gnu clang lld llvm

      - name: Set Se7enKernel name and build N971N
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^    KERNEL_NAME=BatAxeKernel$/    KERNEL_NAME=Se7enKernel/' build.sh
          grep -q '^    KERNEL_NAME=Se7enKernel$' build.sh
          chmod +x build.sh
          # Preserve the known boot-tested build parameters; KSU was advanced above.
          bash build.sh -m d1xks -v N971N-KSUN -k y -l 13 -r n
          test -d build/out/d1xks/zip
          test -s build/out/d1xks/zip/boot.img

      - name: Set up Java 21 and Android SDK for Manager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android command-line tools and Manager SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/android-cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/android-cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline-tools"
          mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"

      - name: Build matching Manager from the exact same KernelSU commit
        shell: bash
        run: |
          set -euo pipefail
          MANAGER_DIR="$GITHUB_WORKSPACE/KernelSU/manager"
          test -x "$MANAGER_DIR/gradlew"
          cd "$MANAGER_DIR"
          python3 - "$KSU_VERSION" <<'PY'
          import pathlib, re, sys
          version = int(sys.argv[1])
          p = pathlib.Path("build.gradle.kts")
          source = p.read_text()
          pattern = r"return\s+29971\s*\+\s*commitCount"
          updated, count = re.subn(pattern, f"return {version}", source, count=1)
          if count != 1:
              raise SystemExit("Cannot safely pin Manager versionCode in this source revision")
          p.write_text(updated)
          print(f"Pinned Manager versionCode={version}")
          PY
          ./gradlew --no-daemon assembleDebug
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -q "versionCode='$KSU_VERSION'"
          mkdir -p "$GITHUB_WORKSPACE/build/export"
          cp "$APK" "$GITHUB_WORKSPACE/build/export/Se7enKernel-KSUN-Manager-v$KSU_VERSION-debug.apk"

      - name: Record exact source, config and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/export
          {
            echo "Kernel base commit: $(git rev-parse HEAD)"
            echo "KernelSU remote: $KSU_REMOTE"
            echo "KernelSU commit: $KSU_SHA"
            echo "KernelSU driver version: $KSU_VERSION"
            echo "Kernel name: Se7enKernel"
            echo "Device: SM-N971N (d1xks)"
            echo "Kernel localversion:"
            grep '^CONFIG_LOCALVERSION=' out/.config || true
          } > build/export/build-info.txt
          (cd build/out/d1xks/zip && sha256sum * > "$GITHUB_WORKSPACE/build/export/kernel-SHA256SUMS")
          (cd build/export && sha256sum *.apk > manager-SHA256SUMS)
          cat build/export/build-info.txt
          cat build/export/kernel-SHA256SUMS
          cat build/export/manager-SHA256SUMS

      - name: Upload Se7enKernel package and matched Manager
        uses: actions/upload-artifact@v4
        with:
          name: Se7enKernel-N971N-KSUN-${{ github.run_number }}
          path: |
            build/out/d1xks/zip/*
            build/export/*
          if-no-files-found: error
          retention-days: 30
