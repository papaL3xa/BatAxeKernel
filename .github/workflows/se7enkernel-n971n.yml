name: Se7enKernel N971N KernelSU-Next 32473 + Matching Manager

on:
  push:
    branches:
      - se7en-kernel-n971n
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout boot-tested BatAxeKernel base
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Fetch official KernelSU-Next and resolve exact 32473 source revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          git -C KernelSU-Next fetch --unshallow origin 2>/dev/null || true
          git -C KernelSU-Next fetch origin dev --tags
          git -C KernelSU-Next checkout --detach origin/dev

          # KSUN computes KSU_VERSION as 30000 + git rev-list --count HEAD.
          # Select the genuine historical source commit whose own count is 2473,
          # rather than spoofing a version number in either kernel or Manager.
          python3 - <<'PY'
          import subprocess, sys
          repo = "KernelSU-Next"
          commits = subprocess.check_output(
              ["git", "-C", repo, "rev-list", "--reverse", "HEAD"], text=True
          ).splitlines()
          target = 2473
          found = None
          for i, sha in enumerate(commits):
              if i + 1 < target:
                  continue
              count = int(subprocess.check_output(
                  ["git", "-C", repo, "rev-list", "--count", sha], text=True
              ).strip())
              if count == target:
                  found = sha
                  break
          if not found:
              sys.exit(
                  "No official KernelSU-Next commit computes versionCode 32473 "
                  "(30000 + reachable commit count 2473). Refusing to spoof it."
              )
          print(f"Official KernelSU-Next commit: {found}")
          print(f"Kernel/Manager version: {30000 + target}")
          with open(__import__("os").environ["GITHUB_ENV"], "a") as f:
              f.write(f"KSUN_SHA={found}\n")
              f.write("KSUN_VERSION=32473\n")
          PY

      - name: Integrate official KernelSU-Next into the kernel source
        shell: bash
        run: |
          set -euo pipefail
          sh KernelSU-Next/kernel/setup.sh "$KSUN_SHA"
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kbuild
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q 'kernelsu' drivers/Makefile
          echo "KernelSU-Next integration points verified."

      - name: Set timezone and install kernel build dependencies
        run: |
          sudo timedatectl set-timezone Asia/Jakarta
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential gcc-aarch64-linux-gnu clang lld llvm

      - name: Set Se7enKernel name and build N971N
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^    KERNEL_NAME=BatAxeKernel$/    KERNEL_NAME=Se7enKernel/' build.sh
          grep -q '^    KERNEL_NAME=Se7enKernel$' build.sh
          chmod +x build.sh
          # Keep the boot-tested N971N parameters and existing KSUN config.
          bash build.sh -m d1xks -v N971N-KSUN-32473 -k y -l 13 -r n
          test -d build/out/d1xks/zip
          test -s build/out/d1xks/zip/boot.img

      - name: Set up Java 21 and Android SDK for official KSUN Manager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK required by official KSUN Manager
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/android-cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/android-cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline-tools"
          mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - name: Build official Manager from the exact same KernelSU-Next commit
        shell: bash
        run: |
          set -euo pipefail
          MANAGER_DIR="$GITHUB_WORKSPACE/KernelSU-Next/manager"
          test -x "$MANAGER_DIR/gradlew"
          cd "$MANAGER_DIR"
          ./gradlew --no-daemon assembleDebug
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" | grep -q "versionCode='32473'"
          mkdir -p "$GITHUB_WORKSPACE/build/export"
          cp "$APK" "$GITHUB_WORKSPACE/build/export/Se7enKernel-KernelSU-Next-Manager-v32473-debug.apk"

      - name: Record exact source, config and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/export
          {
            echo "Kernel base commit: $(git rev-parse HEAD)"
            echo "KernelSU-Next official remote: https://github.com/KernelSU-Next/KernelSU-Next.git"
            echo "KernelSU-Next commit: $KSUN_SHA"
            echo "KernelSU-Next driver/Manager version: $KSUN_VERSION"
            echo "Manager package: com.rifsxd.ksunext"
            echo "Kernel name: Se7enKernel"
            echo "Device: SM-N971N (d1xks)"
            echo "Kernel localversion:"
            grep '^CONFIG_LOCALVERSION=' out/.config || true
          } > build/export/build-info.txt
          (cd build/out/d1xks/zip && sha256sum * > "$GITHUB_WORKSPACE/build/export/kernel-SHA256SUMS")
          (cd build/export && sha256sum *.apk > manager-SHA256SUMS)
          cat build/export/build-info.txt
          cat build/export/kernel-SHA256SUMS
          cat build/export/manager-SHA256SUMS

      - name: Upload Se7enKernel and matching official KSUN Manager
        uses: actions/upload-artifact@v4
        with:
          name: Se7enKernel-N971N-KernelSU-Next-32473-${{ github.run_number }}
          path: |
            build/out/d1xks/zip/*
            build/export/*
          if-no-files-found: error
          retention-days: 30
